name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=low

      - name: Typecheck
        run: npm run typecheck

      - name: Run regression matrix
        run: npm run test:regressions

      - name: Validate genuine local D1 scenarios
        run: |
          npm run test:finance-fees:local
          npm run test:week-setup:local
          npm run test:teaching-load-matrix:local

      - name: Validate fresh local D1 seed
        run: npm run test:finance-seed:local

      - name: Validate local backup and restore
        run: npm run test:backup-restore:local

      - name: Build frontend and Worker
        run: npm run build
